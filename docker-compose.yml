services:
  notepad:
    build: .
    ports:
      - "${APP_PORT:-31300}:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      DATA_DIR: /data
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB:-20}
      MAX_IMPORT_ZIP_MB: ${MAX_IMPORT_ZIP_MB:-50}
      MAX_NOTE_CONTENT_BYTES: ${MAX_NOTE_CONTENT_BYTES:-1048576}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-10}
      AUTO_BACKUP_INTERVAL_HOURS: ${AUTO_BACKUP_INTERVAL_HOURS:-0}
    volumes:
      - notepad-data:/data
    restart: unless-stopped

volumes:
  notepad-data:
