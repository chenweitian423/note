name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker Compose env file
        run: |
          sudo mkdir -p /opt/online-notepad
          sudo tee /opt/online-notepad/.env >/dev/null <<'EOF'
          APP_PASSWORD=ci-placeholder
          AUTH_SECRET=ci-placeholder-secret-with-at-least-32-chars
          APP_PORT=31300
          MAX_ATTACHMENT_MB=20
          SECURE_COOKIES=false
          EOF

      - name: Validate Docker Compose config
        run: docker compose config

  e2e:
    name: Playwright 1.60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Run end-to-end tests
        run: npm run e2e
